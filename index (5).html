<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 결혼 상대 결정하기💍</title>

  <style>
    /* 전체 화면 기본 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #333;
    }

    /* 화면을 왼쪽 검색 영역과 오른쪽 지도로 분리 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* 왼쪽 검색 영역 */
    .sidebar {
      display: flex;
      flex-direction: column;
      width: 390px;
      min-width: 330px;
      padding: 24px;
      background: #fffafd;
      border-right: 1px solid #f0dfe7;
      z-index: 1;
    }

    /* 사이트 제목 */
    .logo {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.4;
      color: #bd6487;
    }

    .description {
      margin: 0 0 20px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 업체 유형을 선택하는 탭 */
    .tab-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #e7ccd8;
      border-radius: 9px;
      background: #fff;
      color: #85586b;
      font-size: 13px;
      cursor: pointer;
    }

    /* 선택된 탭의 디자인 */
    .tab-button.active {
      border-color: #c96d93;
      background: #c96d93;
      color: white;
      font-weight: bold;
    }

    /* 지역 검색창과 버튼 */
    .search-form {
      display: flex;
      gap: 7px;
    }

    #searchInput {
      flex: 1;
      width: 0;
      min-width: 0;
      padding: 12px;
      border: 1px solid #e2d6dc;
      border-radius: 8px;
      outline: none;
      font-size: 13px;
    }

    #searchInput:focus {
      border-color: #c96d93;
    }

    #searchButton {
      padding: 0 15px;
      border: none;
      border-radius: 8px;
      background: #c96d93;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #searchButton:hover {
      background: #ad5278;
    }

    #searchButton:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* 현재 위치 확인 버튼 */
    #locationButton {
      margin-top: 9px;
      padding: 10px;
      border: 1px solid #e7ccd8;
      border-radius: 8px;
      background: white;
      color: #85586b;
      cursor: pointer;
    }

    /* 검색 결과 안내 문구 */
    #status {
      margin: 16px 0 8px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    /* 검색 결과 목록 */
    #resultList {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .place-item {
      padding: 15px 8px;
      border-bottom: 1px solid #f0e5ea;
      cursor: pointer;
    }

    .place-item:hover {
      background: #fff0f5;
    }

    .place-name {
      margin-bottom: 7px;
      font-size: 15px;
      font-weight: bold;
      color: #49353e;
    }

    .place-address {
      margin-bottom: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    .place-category {
      color: #bd6487;
      font-size: 11px;
      line-height: 1.5;
    }

    .place-phone {
      margin-top: 6px;
      color: #666;
      font-size: 12px;
    }

    .place-link {
      display: inline-block;
      margin-top: 8px;
      color: #bd6487;
      font-size: 12px;
      text-decoration: none;
    }

    /* 오른쪽 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #f4f4f4;
    }

    /* 작은 화면에서는 검색 영역과 지도를 위아래로 배치 */
    @media (max-width: 650px) {
      .container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: 0;
        height: 52%;
        padding: 14px;
      }

      .logo {
        font-size: 20px;
      }

      #map {
        width: 100%;
        height: 48%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 왼쪽 업체 검색 영역 -->
    <aside class="sidebar">
      <h1 class="logo">내 결혼 상대 결정하기💍</h1>

      <p class="description">
        나에게 맞는 결혼정보사를 찾아보세요.<br>
        업체 유형을 선택하고 시·구·동 단위로 지역을 검색해 보세요.
      </p>

      <!-- 업체 유형을 선택하는 탭 버튼 -->
      <div class="tab-container">
        <button
          type="button"
          class="tab-button active"
          data-keyword="결혼정보사"
          aria-pressed="true"
        >
          결혼정보회사
        </button>

        <button
          type="button"
          class="tab-button"
          data-keyword="재혼전문업체"
          aria-pressed="false"
        >
          재혼 전문 업체
        </button>
      </div>

      <!-- 지역을 입력해 검색하는 창 -->
      <form class="search-form" id="searchForm">
        <input
          type="text"
          id="searchInput"
          placeholder="지역별로 알아보기 (예: 부산 해운대구)"
          aria-label="검색할 지역"
        >
        <button type="submit" id="searchButton">검색</button>
      </form>

      <!-- 현재 위치를 다시 확인하는 버튼 -->
      <button type="button" id="locationButton">
        📍 내 주변 업체 찾기
      </button>

      <!-- 검색 결과 상태 안내 -->
      <p id="status" role="status" aria-live="polite">
        지도를 불러오는 중입니다.
      </p>

      <!-- 검색 결과 목록 -->
      <ul id="resultList"></ul>
    </aside>

    <!-- 오른쪽 카카오 지도 -->
    <main id="map" aria-label="결혼정보사 위치 지도"></main>
  </div>

  <!-- 카카오 지도 SDK와 장소 검색 라이브러리 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=f38811e47209589c76ef3002c7c95204&libraries=services&autoload=false"
    onerror="showSdkError()"
  ></script>

  <script>
    // 지도와 검색에 필요한 변수
    let map;
    let placesService;
    let geocoder;
    let infoWindow;
    let markers = [];
    let currentPosition = null;
    let currentLocationMarker = null;
    let activeKeyword = "결혼정보사";
    let searchRequestId = 0;

    // HTML 요소를 변수에 저장
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const locationButton = document.getElementById("locationButton");
    const resultList = document.getElementById("resultList");
    const statusText = document.getElementById("status");
    const tabButtons = document.querySelectorAll(".tab-button");

    // 카카오 지도 SDK를 불러오지 못했을 때 안내
    function showSdkError() {
      statusText.textContent =
        "지도를 불러오지 못했습니다. 인터넷 연결과 카카오 API 키 및 웹 도메인 설정을 확인해 주세요.";
    }

    // 지도 SDK가 준비된 뒤 지도와 검색 기능 실행
    function initializeMap() {
      if (!window.kakao || !window.kakao.maps) {
        showSdkError();
        return;
      }

      // 지도 라이브러리 로딩이 끝난 뒤 실행
      kakao.maps.load(function () {
        // 처음 지도는 서울 시청을 중심으로 표시
        const initialPosition = new kakao.maps.LatLng(37.5665, 126.9780);

        // 지도 생성 및 확대 레벨 설정
        map = new kakao.maps.Map(document.getElementById("map"), {
          center: initialPosition,
          level: 5
        });

        // 장소 검색 객체와 상세 정보창 생성
        placesService = new kakao.maps.services.Places();
        geocoder = new kakao.maps.services.Geocoder();
        infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });

        // 검색창에서 엔터 또는 검색 버튼을 누르면 실행
        searchForm.addEventListener("submit", function (event) {
          event.preventDefault();
          searchPlaces();
        });

        // 현재 위치 버튼을 누르면 위치 확인 후 주변 업체 검색
        locationButton.addEventListener("click", function () {
          getCurrentLocation(function () {
            searchPlaces();
          });
        });

        // 탭을 바꾸면 업체 유형에 맞춰 다시 검색
        tabButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            activeKeyword = button.dataset.keyword;

            // 선택된 탭의 디자인과 접근성 상태 변경
            tabButtons.forEach(function (tab) {
              const isActive = tab === button;
              tab.classList.toggle("active", isActive);
              tab.setAttribute("aria-pressed", String(isActive));
            });

            // 이전 검색 결과를 지운 후 새로운 업체 검색
            clearSearchResults();
            searchPlaces();
          });
        });

        statusText.textContent = "현재 위치를 확인하고 주변 업체를 검색합니다.";

        // 페이지가 열리면 위치 권한을 요청
        getCurrentLocation(function () {
          searchPlaces();
        });
      });
    }

    // 브라우저에서 현재 위치를 확인
    function getCurrentLocation(onComplete) {
      if (!navigator.geolocation) {
        statusText.textContent =
          "이 브라우저에서는 위치 기능을 사용할 수 없습니다. 지역을 입력해 검색해 주세요.";
        if (onComplete) onComplete(false);
        return;
      }

      statusText.textContent = "현재 위치를 확인하고 있습니다.";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도를 저장
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          // 현재 위치로 지도 이동
          map.setCenter(currentPosition);

          // 이전 현재 위치 마커가 있으면 제거
          if (currentLocationMarker) {
            currentLocationMarker.setMap(null);
          }

          // 현재 위치를 나타내는 마커 생성
          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });
          currentLocationMarker.setTitle("현재 위치");

          statusText.textContent = "현재 위치를 확인했습니다.";
          if (onComplete) onComplete(true);
        },
        function (error) {
          // 위치 확인에 실패했을 때 원인을 안내
          if (error.code === error.PERMISSION_DENIED) {
            statusText.textContent =
              "위치 권한이 거부되었습니다. 지역을 입력하면 검색할 수 있습니다.";
          } else if (error.code === error.POSITION_UNAVAILABLE) {
            statusText.textContent =
              "현재 위치를 확인할 수 없습니다. 지역 검색은 계속할 수 있습니다.";
          } else {
            statusText.textContent =
              "위치 확인 시간이 초과되었습니다. 지역 검색은 계속할 수 있습니다.";
          }

          if (onComplete) onComplete(false);
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 검색 결과 마커와 상세 정보창 제거
    function clearMarkers() {
      markers.forEach(function (marker) {
        marker.setMap(null);
      });
      markers = [];

      if (infoWindow) {
        infoWindow.close();
      }
    }

    // 이전 검색 결과를 모두 초기화
    function clearSearchResults() {
      // 이전 검색 요청의 응답을 무시하도록 번호 변경
      searchRequestId++;
      clearMarkers();
      resultList.replaceChildren();
    }

    // 선택한 탭에 맞는 검색어 후보를 준비
    function getSearchKeywords() {
      if (activeKeyword === "재혼전문업체") {
        // 재혼 전문 탭에서는 재혼 관련 검색어만 사용한다.
        // 일반 결혼정보회사 검색어를 섞지 않는다.
        return ["재혼정보회사", "재혼전문", "재혼정보", "재혼 전문 결혼정보회사"];
      }

      // 일반 결혼정보회사 탭의 검색어
      return ["결혼정보회사", "결혼정보업체", "결혼정보사", "결혼정보"];
    }

    // 입력한 지역명을 좌표로 변환
    function findRegionPosition(region) {
      return new Promise(function (resolve) {
        if (!geocoder) { resolve(null); return; }
        geocoder.addressSearch(region, function (result, status) {
          if (status === kakao.maps.services.Status.OK && result && result.length > 0) {
            resolve(new kakao.maps.LatLng(result[0].y, result[0].x));
          } else {
            resolve(null);
          }
        });
      });
    }

    // 카카오 장소 검색을 Promise 형태로 실행
    function requestPlaces(keyword, options) {
      return new Promise(function (resolve) {
        placesService.keywordSearch(keyword, function (data, status) {
          if (status === kakao.maps.services.Status.OK) {
            resolve({ places: data || [], hadError: false });
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            resolve({ places: [], hadError: false });
          } else {
            resolve({ places: [], hadError: true });
          }
        }, options || {});
      });
    }

    // 검색 결과를 중복 없이 합치기
    function mergeUniquePlaces(results) {
      const uniquePlaces = new Map();
      results.forEach(function (place) {
        const key = place.id || place.place_url ||
          (place.place_name + "|" + (place.road_address_name || place.address_name));
        if (!uniquePlaces.has(key)) uniquePlaces.set(key, place);
      });
      // 한 번에 너무 많은 마커가 생기지 않도록 최대 75개 표시
      return Array.from(uniquePlaces.values()).slice(0, 75);
    }

    // 여러 검색어와 페이지를 이용해 업체 검색
    async function searchPlaces() {
      if (!placesService) return;
      const region = searchInput.value.trim();
      searchRequestId++;
      const requestId = searchRequestId;
      clearMarkers();
      resultList.replaceChildren();
      searchButton.disabled = true;
      statusText.textContent = region
        ? region + " 지역의 업체를 여러 검색어로 찾고 있습니다..."
        : "주변 업체를 여러 검색어로 찾고 있습니다...";

      const searchKeywords = getSearchKeywords();
      const tasks = [];
      let anyError = false;

      try {
        if (region) {
          // 지역 이름을 좌표로 변환해 해당 지역 주변에서도 검색
          const regionPosition = await findRegionPosition(region);
          if (requestId !== searchRequestId) return;

          if (regionPosition) {
            map.setCenter(regionPosition);
            // 한 페이지는 최대 15개이므로 검색어별 1~2페이지를 조회
            searchKeywords.forEach(function (keyword) {
              [1, 2].forEach(function (pageNumber) {
                tasks.push(requestPlaces(keyword, {
                  location: regionPosition,
                  radius: 20000,
                  page: pageNumber,
                  sort: kakao.maps.services.SortBy.ACCURACY
                }));
              });
            });
          }

          // 지역명을 검색어에도 포함해 주변 좌표 검색을 보완
          searchKeywords.forEach(function (keyword) {
            tasks.push(requestPlaces(region + " " + keyword, { page: 1 }));
          });
        } else {
          // 지역 미입력 시 현재 위치(없으면 지도 중심)에서 반경 20km 검색
          const searchCenter = currentPosition || map.getCenter();
          searchKeywords.forEach(function (keyword) {
            [1, 2, 3].forEach(function (pageNumber) {
              tasks.push(requestPlaces(keyword, {
                location: searchCenter,
                radius: 20000,
                page: pageNumber,
                sort: kakao.maps.services.SortBy.DISTANCE
              }));
            });
          });
        }

        const responses = await Promise.all(tasks);
        if (requestId !== searchRequestId) return;

        let allPlaces = [];
        responses.forEach(function (response) {
          allPlaces = allPlaces.concat(response.places);
          if (response.hadError) anyError = true;
        });

        const uniquePlaces = mergeUniquePlaces(allPlaces);
        searchButton.disabled = false;

        if (uniquePlaces.length > 0) {
          displayResults(uniquePlaces);
          statusText.textContent =
            (region ? region + " 지역의 " : "주변 ") +
            "검색 결과 " + uniquePlaces.length + "개를 표시합니다." +
            (activeKeyword === "재혼전문업체"
              ? " (재혼 전문 서비스 여부는 업체에 확인해 주세요.)"
              : "");
        } else if (anyError) {
          statusText.textContent =
            "카카오 장소 검색 요청에 실패했습니다. API 키, 웹 도메인 설정 또는 네트워크 연결을 확인해 주세요.";
        } else {
          statusText.textContent = activeKeyword === "재혼전문업체"
            ? "재혼 관련 검색 결과가 없습니다. 카카오맵에 등록된 재혼 관련 업체가 없거나 검색어가 일치하지 않을 수 있습니다. 일반 결혼정보회사 결과는 대신 표시하지 않습니다."
            : "검색 결과가 없습니다. 시·구·동처럼 더 구체적인 지역명을 입력하거나 다른 검색어를 시도해 보세요.";
        }
      } catch (error) {
        if (requestId !== searchRequestId) return;
        searchButton.disabled = false;
        statusText.textContent =
          "검색 중 문제가 발생했습니다. 인터넷 연결과 카카오 API 설정을 확인해 주세요.";
      }
    }


    // 검색 결과를 지도 마커와 왼쪽 목록으로 표시
    function displayResults(places) {
      const bounds = new kakao.maps.LatLngBounds();

      places.forEach(function (place, index) {
        // 업체 위치를 지도 좌표로 변환
        const position = new kakao.maps.LatLng(
          Number(place.y),
          Number(place.x)
        );
        bounds.extend(position);

        // 지도에 업체 위치 마커 생성
        const marker = new kakao.maps.Marker({
          map: map,
          position: position
        });
        marker.setTitle(place.place_name);
        markers.push(marker);

        // 마커를 클릭하면 업체 이름과 주소 팝업 표시
        kakao.maps.event.addListener(marker, "click", function () {
          showPlaceInfo(place, marker);
        });

        // 왼쪽 목록에 표시할 업체 항목 생성
        const listItem = document.createElement("li");
        listItem.className = "place-item";

        const name = document.createElement("div");
        name.className = "place-name";
        name.textContent = (index + 1) + ". " + place.place_name;

        const address = document.createElement("div");
        address.className = "place-address";
        address.textContent =
          place.road_address_name || place.address_name || "주소 정보 없음";

        const category = document.createElement("div");
        category.className = "place-category";
        category.textContent = place.category_name || "업종 정보 없음";

        listItem.append(name, address, category);

        // 전화번호가 등록되어 있다면 함께 표시
        if (place.phone) {
          const phone = document.createElement("div");
          phone.className = "place-phone";
          phone.textContent = "전화번호: " + place.phone;
          listItem.appendChild(phone);
        }

        // 카카오맵의 업체 상세 페이지 링크 추가
        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 보기";
          listItem.appendChild(link);
        }

        // 업체 목록을 클릭하면 지도 이동 및 상세 팝업 표시
        listItem.addEventListener("click", function (event) {
          if (event.target.closest("a")) return;
          map.panTo(position);
          showPlaceInfo(place, marker);
        });

        resultList.appendChild(listItem);
      });

      // 모든 검색 결과가 지도 안에 보이도록 조정
      if (places.length > 0) {
        map.setBounds(bounds);
      }
    }

    // 선택한 업체의 이름과 주소를 정보창에 표시
    function showPlaceInfo(place, marker) {
      const content = document.createElement("div");
      content.style.padding = "10px";
      content.style.maxWidth = "240px";
      content.style.fontSize = "13px";
      content.style.lineHeight = "1.6";

      const name = document.createElement("strong");
      name.textContent = place.place_name;
      name.style.color = "#bd6487";

      const address = document.createElement("div");
      address.style.marginTop = "5px";
      address.textContent =
        place.road_address_name || place.address_name || "주소 정보 없음";

      content.append(name, address);

      // 전화번호가 있으면 팝업에 추가
      if (place.phone) {
        const phone = document.createElement("div");
        phone.style.marginTop = "5px";
        phone.textContent = "전화번호: " + place.phone;
        content.appendChild(phone);
      }

      // 기존 팝업을 닫고 선택한 업체의 상세 정보 표시
      infoWindow.close();
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    // SDK가 로드된 뒤 초기화 함수 실행
    if (window.kakao && window.kakao.maps) {
      initializeMap();
    } else {
      showSdkError();
    }
  </script>
</body>
</html>
